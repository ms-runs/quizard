<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Poiret+One&display=swap" rel="stylesheet">
<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/supabase.js"></script>
<style>
:root{
  --bg:#0A0A1E; --s1:#11112B; --s2:#1A1A3A; --s3:#232348;
  --gold:#D4AF37; --gold-hi:#E6C65A;
  --ivory:#F2EDDC; --iv2:rgba(242,237,220,.80); --iv3:rgba(242,237,220,.68);
  --line:rgba(212,175,55,.34); --line2:rgba(212,175,55,.16);
  --bad:#E58C7C;
  --ease:cubic-bezier(.22,.8,.24,1);
  --f-d:"Poiret One","Jost",serif; --f-b:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rh:62px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ivory);font:400 16px/1.5 var(--f-b);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- deco frame ---------- */
.frame{position:relative;border:1px solid var(--line);background:var(--s1)}
.frame::before{content:"";position:absolute;inset:7px;border:1px solid var(--line2);pointer-events:none}
.frame::after{content:"";position:absolute;inset:-1px;pointer-events:none;
  --g:linear-gradient(var(--gold),var(--gold));
  background:
   var(--g) left top/26px 2px no-repeat, var(--g) left top/2px 26px no-repeat,
   var(--g) right top/26px 2px no-repeat, var(--g) right top/2px 26px no-repeat,
   var(--g) left bottom/26px 2px no-repeat, var(--g) left bottom/2px 26px no-repeat,
   var(--g) right bottom/26px 2px no-repeat, var(--g) right bottom/2px 26px no-repeat,
   var(--g) left 8px top 8px/14px 1px no-repeat, var(--g) left 8px top 8px/1px 14px no-repeat,
   var(--g) right 8px top 8px/14px 1px no-repeat, var(--g) right 8px top 8px/1px 14px no-repeat,
   var(--g) left 8px bottom 8px/14px 1px no-repeat, var(--g) left 8px bottom 8px/1px 14px no-repeat,
   var(--g) right 8px bottom 8px/14px 1px no-repeat, var(--g) right 8px bottom 8px/1px 14px no-repeat;}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--line);background:transparent;color:var(--ivory);cursor:pointer;border-radius:2px;font-weight:500;transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.btn:hover:not(:disabled){border-color:var(--gold);background:rgba(212,175,55,.08)}
.btn:active:not(:disabled){background:rgba(212,175,55,.16)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#14110a}
.btn.pri:hover:not(:disabled){background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.sm{min-height:36px;padding:0 12px}
.btn.ico{padding:0;width:44px}
.btn.ico.sm{width:36px}
.btn.danger{color:var(--bad);border-color:rgba(229,140,124,.4)}
.btn.danger:hover:not(:disabled){border-color:var(--bad);background:rgba(229,140,124,.08)}
.inp{min-height:44px;padding:0 12px;background:var(--bg);border:1px solid var(--line);border-radius:2px;width:100%}
.inp:hover{border-color:rgba(212,175,55,.6)}
select.inp{appearance:auto}
.lbl{display:block;font-size:14px;color:var(--iv3);margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid var(--line2);font-size:14px;color:var(--iv2)}
.dot{width:8px;height:8px;background:var(--iv3);display:inline-block}
.dot.ok{background:var(--gold)}
.dot.bad{background:var(--bad)}

/* ---------- board ---------- */
.board{min-height:100vh;display:flex;flex-direction:column;padding:clamp(16px,2.6vw,40px);gap:clamp(14px,2vw,28px)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.mark{font-family:var(--f-d);font-size:clamp(22px,2.4vw,32px);color:var(--gold);letter-spacing:.02em}
.crumb{color:var(--iv2);font-size:clamp(14px,1.3vw,18px)}
.bbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(14px,2vw,28px)}
.bbody.split{grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr)}
@media (max-width:900px){.bbody.split{grid-template-columns:minmax(0,1fr)}}
.stage{padding:clamp(28px,4.2vw,72px);display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,2.4vw,36px);min-height:min(62vh,640px)}
.eyebrow{color:var(--gold);font-size:clamp(15px,1.4vw,20px);font-weight:500}
.qtext{font-size:clamp(28px,4vw,64px);line-height:1.16;font-weight:400;max-width:22ch;margin:0;text-wrap:balance}
.qtext.wide{max-width:28ch}
.ans{border-top:1px solid var(--line);padding-top:clamp(14px,1.6vw,24px);animation:rise .5s var(--ease) both}
.ans small{display:block;color:var(--iv3);font-size:clamp(14px,1.2vw,17px);margin-bottom:4px}
.ans b{font-weight:500;font-size:clamp(26px,3.4vw,52px);color:var(--gold);line-height:1.15}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.big{font-family:var(--f-d);font-size:clamp(48px,9vw,148px);line-height:1;margin:0;color:var(--ivory)}
.sub{font-size:clamp(20px,2.4vw,36px);color:var(--iv2);margin:0;max-width:30ch}
.rule{font-size:clamp(15px,1.4vw,20px);color:var(--iv3);max-width:52ch;margin:0}
.photo{aspect-ratio:16/9;max-height:34vh;border:1px dashed var(--line);display:grid;place-items:center;color:var(--iv3);font-size:clamp(16px,1.6vw,22px)}
.clock{font-family:var(--f-b);font-weight:500;font-size:clamp(72px,14vw,220px);line-height:1;color:var(--gold)}
.clock.low{color:var(--bad)}

.side{padding:clamp(18px,2vw,30px);display:flex;flex-direction:column;gap:12px;align-self:start}
.side h3{margin:0 0 4px;font-family:var(--f-d);font-weight:400;font-size:clamp(22px,2vw,28px);color:var(--gold)}
.srow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;min-height:44px;border-top:1px solid var(--line2)}
.srow:first-of-type{border-top:0}
.srow .rk{color:var(--iv3)}
.srow .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .tt{font-weight:500}
.srow.top .rk,.srow.top .tt{color:var(--gold)}

/* full standings */
.stand{padding:clamp(18px,2.4vw,40px);overflow-x:auto}
.stand h2{margin:0 0 clamp(14px,2vw,28px);font-family:var(--f-d);font-weight:400;font-size:clamp(34px,5vw,72px);color:var(--ivory);line-height:1}
.stand .sub2{color:var(--iv2);margin:0 0 clamp(14px,2vw,26px);font-size:clamp(15px,1.4vw,19px)}
.trow{display:grid;grid-template-columns:70px minmax(150px,1.6fr) repeat(var(--n,1),minmax(46px,.5fr)) 100px;align-items:center;gap:6px;height:var(--rh);border-top:1px solid var(--line2);font-size:clamp(17px,1.7vw,26px);position:relative;background:var(--s1)}
.thead{height:38px;border-top:0;font-size:14px;color:var(--iv3)}
.trow .c{text-align:center}
.trow .rk{display:flex;align-items:center;gap:6px;color:var(--iv2)}
.trow .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tot{text-align:right;font-weight:500;font-size:clamp(20px,2vw,32px);padding-right:6px}
.trow.top .rk,.trow.top .tot{color:var(--gold)}
.trow .last{color:var(--gold)}
.trow .jk{display:inline-block;margin-left:3px;font-size:12px;color:var(--gold);border:1px solid var(--line);padding:0 4px;line-height:16px;vertical-align:middle}
.mv{display:inline-flex;align-items:center;font-size:13px;color:var(--gold);gap:1px}
.mv.dn{color:var(--iv3)}
.empty{padding:clamp(24px,4vw,56px);color:var(--iv2);font-size:clamp(18px,2vw,26px)}
@media (max-width:720px){
  .trow{grid-template-columns:54px 1fr 70px 80px}
  .trow .rd{display:none}
  .trow .rd.last{display:block}
}

/* ---------- host ---------- */
.host{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:auto 1fr}
@media (max-width:860px){.host{grid-template-columns:1fr}}
.hhead{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px clamp(14px,2vw,28px);border-bottom:1px solid var(--line2)}
.hhead .mark{font-size:26px}
.rail{padding:14px;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:2px;background:var(--s1)}
@media (max-width:860px){.rail{border-right:0;border-bottom:1px solid var(--line2);flex-direction:row;overflow-x:auto}}
.ritem{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;min-height:44px;padding:4px 10px;border:1px solid transparent;background:transparent;text-align:left;cursor:pointer;border-radius:2px;white-space:nowrap}
.ritem:hover{background:rgba(212,175,55,.06)}
.ritem.cur{border-color:var(--gold);background:rgba(212,175,55,.08)}
.ritem .n{color:var(--iv3)}
.ritem .t{overflow:hidden;text-overflow:ellipsis}
.hmain{padding:clamp(14px,2vw,28px);display:flex;flex-direction:column;gap:20px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2)}
.tab{min-height:44px;padding:0 16px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--iv2);cursor:pointer;font-weight:500}
.tab:hover{color:var(--ivory)}
.tab[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
.panel{background:var(--s1);border:1px solid var(--line2);padding:clamp(14px,1.8vw,24px)}
.panel h3{margin:0 0 10px;font-size:18px;font-weight:500}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.now{font-size:clamp(20px,2vw,28px);line-height:1.25;margin:4px 0 14px}
.now small{display:block;font-size:14px;color:var(--iv3);margin-bottom:4px}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{font-size:13px;color:var(--iv3);margin-top:12px}
.kbd b{font-weight:500;color:var(--iv2);border:1px solid var(--line2);padding:0 6px}
.note{color:var(--iv2);margin:0}
.flag{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-size:14px;margin-top:8px}
.ansbox{border-left:2px solid var(--gold);padding:4px 0 4px 12px;margin:12px 0}
.ansbox small{display:block;color:var(--iv3);font-size:13px}
.steplist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.steplist button{min-width:44px;min-height:36px;border:1px solid var(--line2);background:transparent;cursor:pointer;border-radius:2px;color:var(--iv2)}
.steplist button.cur{background:var(--gold);color:#14110a;border-color:var(--gold)}
.steplist button.done{color:var(--gold);border-color:var(--line)}
table.sc{width:100%;border-collapse:collapse}
table.sc th{font-weight:400;color:var(--iv3);font-size:14px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.sc td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.step{display:inline-flex;align-items:center}
.step input{width:64px;min-height:44px;text-align:center;background:var(--bg);border:1px solid var(--line);border-left:0;border-right:0;border-radius:0}
.step button{width:44px;min-height:44px;border:1px solid var(--line);background:transparent;cursor:pointer}
.step button:hover{background:rgba(212,175,55,.1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.pill{display:inline-block;font-size:13px;border:1px solid var(--line);color:var(--gold);padding:0 8px;line-height:20px}
.toast{color:var(--iv2);font-size:14px;min-height:20px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;min-height:52px;border-bottom:1px solid var(--line2)}
.skeleton{height:14px;background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:2px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.center{display:grid;place-items:center;min-height:60vh;padding:24px}
.center .panel{max-width:520px;width:100%}
.spares li{display:block;padding:10px 0}
.spares small{color:var(--iv3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- join / qr ---------- */
.qr{background:#F2EDDC;padding:14px;display:inline-block;line-height:0}
.qr svg{width:min(30vh,280px);height:auto;display:block}
.joinrow{display:flex;gap:clamp(24px,4vw,64px);align-items:center;flex-wrap:wrap}
.bigcode{font-weight:500;font-size:clamp(44px,7vw,108px);letter-spacing:.14em;color:var(--gold);line-height:1}
.hostqr .qr svg{width:180px}

/* ---------- player (phone) ---------- */
.player{min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:16px;max-width:560px;margin:0 auto}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.phead .mark{font-size:24px}
.phead .tm{color:var(--iv2);font-size:15px}
.qline{padding:16px 0;border-top:1px solid var(--line2)}
.qline:first-child{border-top:0}
.qline .qn{color:var(--gold);font-size:14px;margin:0 0 4px}
.qline .qt{font-size:18px;line-height:1.3;margin:0 0 10px}
.qline input,.qline textarea{width:100%;min-height:50px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:2px;font-size:17px}
.qline textarea{min-height:150px;resize:vertical}
.qline .st{font-size:13px;color:var(--iv3);min-height:18px;margin-top:4px}
.qline.locked input,.qline.locked textarea{opacity:.55}
.teampick{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px}
.psc .srow{min-height:48px}
.srow.me .tn{color:var(--gold)}
.arev td{vertical-align:top;min-width:96px}
.arev .ansv{display:block;margin-bottom:6px;word-break:break-word}
.mk{min-width:52px}
.mk.s{border-style:dashed}

/* ---------- Art Deco theme (Cincinnati) ---------- */
body.theme-deco{background-color:var(--bg);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><g fill='none' stroke='%23D4AF37' stroke-opacity='.10' stroke-width='1'><path d='M0 30A30 30 0 0 1 60 30'/><path d='M10 30A20 20 0 0 1 50 30'/><path d='M20 30A10 10 0 0 1 40 30'/><path d='M-30 60A30 30 0 0 1 30 60'/><path d='M-20 60A20 20 0 0 1 20 60'/><path d='M-10 60A10 10 0 0 1 10 60'/><path d='M30 60A30 30 0 0 1 90 60'/><path d='M40 60A20 20 0 0 1 80 60'/><path d='M50 60A10 10 0 0 1 70 60'/></g></svg>")}
.theme-deco .mark{text-transform:uppercase;letter-spacing:.16em;font-size:clamp(17px,1.9vw,24px)}
.theme-deco .big,.theme-deco .stand h2,.theme-deco .side h3{text-transform:uppercase;letter-spacing:.06em}
.theme-deco .big{font-size:clamp(38px,7vw,112px);line-height:1.04}
.theme-deco .stand h2{font-size:clamp(30px,4.4vw,64px)}
.theme-deco .crumb{letter-spacing:.02em}
.theme-deco .stage{padding-top:clamp(44px,5.4vw,84px)}
.theme-deco .stand{padding-top:clamp(44px,5vw,76px)}
.theme-deco .eyebrow{display:flex;align-items:center;gap:12px}
.theme-deco .eyebrow::before{content:"";width:8px;height:8px;border:1px solid var(--gold);transform:rotate(45deg);flex:none}
.rays{position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from -90deg at 50% 120%,rgba(212,175,55,.14) 0 3deg,transparent 3deg 9deg);-webkit-mask-image:radial-gradient(ellipse 85% 95% at 50% 120%,#000 0,transparent 74%);mask-image:radial-gradient(ellipse 85% 95% at 50% 120%,#000 0,transparent 74%)}
.stage>*{position:relative;z-index:1}
.stage>.rays{position:absolute;z-index:0}
.crown{position:absolute!important;left:50%;top:0;transform:translateX(-50%);width:clamp(110px,12vw,170px);z-index:2}
.crown svg{display:block;width:100%;height:auto}
.dd{display:flex;align-items:center;gap:12px;max-width:min(420px,60%)}
.dd::before,.dd::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.6}
.dd i{width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg);flex:none}
.theme-deco .trow .rk{font-family:var(--f-d);font-size:1.45em;color:var(--iv2)}
.theme-deco .trow.top{border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);background:rgba(212,175,55,.07)}
.theme-deco .trow.top .rk{color:var(--gold)}
.theme-deco .srow .rk{font-family:var(--f-d);font-size:1.3em}
.sky{display:block;width:100%;height:clamp(48px,8vw,92px);margin-top:auto;flex:none}
.board .sky{margin-top:auto}

/* ---------- multiple choice + visuals ---------- */
.mcqrow{display:flex;gap:clamp(20px,3vw,56px);align-items:center;flex-wrap:wrap}
.mcqtxt{flex:1 1 320px;display:flex;flex-direction:column;gap:clamp(14px,2vw,28px);min-width:0}
.mcq .qtext{font-size:clamp(24px,3.2vw,52px)}
.opts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1vw,16px)}
.opts li{display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:clamp(10px,1.2vw,18px) clamp(12px,1.4vw,20px);font-size:clamp(17px,2vw,30px);line-height:1.2;transition:opacity .4s,background .4s}
.opts li b{font-weight:500;color:var(--gold);min-width:1.2em}
.opts.rev li.wrong{opacity:.3}
.opts.rev li.right{background:rgba(212,175,55,.16);border-color:var(--gold)}
.vis{flex:0 0 auto;width:clamp(240px,36vw,600px);aspect-ratio:4/3;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:var(--bg)}
.vis.sm{width:100%;max-width:240px;margin:0 0 10px}
.swatch{border-color:var(--iv3)}
.fontbox{padding:12px;text-align:center;font-size:clamp(28px,4vw,64px);line-height:1.1;color:var(--ivory);word-break:break-word}
.vis.sm.fontbox{font-size:34px}
.flagbox img{width:100%;height:100%;object-fit:contain;display:block}
.svgbox svg{width:100%;height:100%;display:block}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;min-height:52px;padding:10px 14px;background:var(--bg);border:1px solid var(--line);color:var(--ivory);font-size:17px;cursor:pointer;border-radius:2px;width:100%}
.choice b{color:var(--gold);font-weight:500;min-width:1.2em}
.choice[aria-pressed=true]{background:var(--gold);color:#0A0A1E;border-color:var(--gold)}
.choice[aria-pressed=true] b{color:#0A0A1E}
.choice:disabled{opacity:.5;cursor:default}
@media (max-width:900px){.opts{grid-template-columns:1fr}}

/* ---------- logos ---------- */
.tlogo{width:1.7em;height:1.7em;border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;color:#fff;font-weight:500;font-size:.62em;line-height:1;letter-spacing:.02em;border:1px solid var(--line);vertical-align:middle}
img.tlogo{font-size:1em;width:1.7em;height:1.7em}
.tlogo.ini{width:2.75em;height:2.75em}
.trow .tn,.srow .tn,.tcell,.pteam,.tpick{display:flex;align-items:center;gap:.6em;min-width:0}
.trow .tn span,.srow .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tn .tlogo{font-size:1em}.trow .tn .tlogo.ini{font-size:.62em}
.lobbyteams{display:flex;flex-wrap:wrap;gap:clamp(12px,1.6vw,24px)}

<body>
<div id="app" aria-live="polite"><div class="center"><div class="panel"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:90%;margin-top:12px"></div></div></div></div>

<script>
/* The question bank loads from quizzes/<id>/quiz.js */
let BANK = null, SCORED = 0, BONUS_IDX = -1, HALF_IDX = -1;
/* =====================================================================
   helpers
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const CROWN = '<svg viewBox="0 0 160 58" fill="none" stroke="#D4AF37" stroke-width="1" stroke-linecap="round"><path d="M93.2 4.8L123.2 15.7M90.7 9.0L115.2 29.6M87.0 12.1L103.0 39.8M82.4 13.8L88.0 45.3M77.6 13.8L72.0 45.3M73.0 12.1L57.0 39.8M69.3 9.0L44.8 29.6M66.8 4.8L36.8 15.7M66 0A14 14 0 0 0 94 0M50 0A30 30 0 0 0 110 0M34 0A46 46 0 0 0 126 0"/><path d="M80 49L85 54L80 59L75 54Z" fill="#0A0A1E"/></svg>';
const SKY = '<svg class="sky" viewBox="0 0 1200 92" preserveAspectRatio="xMidYMax slice" fill="rgba(10,10,30,.85)" stroke="#D4AF37" stroke-width="1" stroke-opacity=".38" aria-hidden="true"><path d="M0 92V62H30V50H46V38H62V50H78V62H110V92"/><path d="M180 92V70H210V56H236V40H258V24H276V10H286V0H294V10H304V24H322V40H344V56H370V70H400V92"/><path d="M440 92V58H470V44H500V30H540V44H570V58H600V92"/><path d="M650 92V64H700A60 60 0 0 1 820 64H870V92"/><path d="M900 92V66H930V52H950V40H1000V52H1020V66H1060V92"/><path d="M1100 92V70H1120V56H1140V44H1160V56H1180V70H1200V92"/><path d="M0 91.5H1200" fill="none"/></svg>';
const deco = () => !!(BANK && BANK.theme === "deco");
const decoTop = () => deco() ? `<div class="rays" aria-hidden="true"></div><div class="crown" aria-hidden="true">${CROWN}</div>` : "";
function qrSVG(text) {
  try {
    const q = qrcode(0, "M"); q.addData(text); q.make(); const n = q.getModuleCount(); let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code to join this quiz"><path d="${d}" fill="#0A0A1E"/></svg>`;
  } catch (e) { return ""; }
}
const LCOL = ["#C8553D", "#2F6690", "#3A7D44", "#8E44AD", "#B8860B", "#E07A5F", "#4361EE", "#2A9D8F"];
const okLogo = v => typeof v === "string" && v.length < 40000 && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(v);
function logoHTML(t, cls) {
  if (!t) return "";
  if (okLogo(t.logo)) return `<img class="tlogo ${cls || ""}" src="${t.logo}" alt="">`;
  const ini = String(t.name || "?").replace(/^the\s+/i, "").split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase();
  let h = 0; for (const ch of String(t.id || t.name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="tlogo ini ${cls || ""}" style="background:${LCOL[h % LCOL.length]}" aria-hidden="true">${esc(ini)}</span>`;
}
const teamOf = id => S.teams.find(t => t.id === id);
function roundComplete(ri) { return S.teams.length > 0 && S.teams.every(t => S.scores[t.id] && S.scores[t.id][ri] !== undefined && S.scores[t.id][ri] !== ""); }
function missingScores(through) { let n = 0; for (let ri = 0; ri <= through; ri++) if (!roundComplete(ri)) n++; return n; }
const standLabel = th => th === SCORED - 1 ? "Final standings" : th === HALF_IDX ? "Half-time standings" : `After round ${th + 1}`;
const ICON = {
  left:'<path d="M10 3 5 8l5 5"/>', right:'<path d="M6 3l5 5-5 5"/>',
  eye:'<path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/>',
  up:'<path d="M4 10l4-4 4 4"/>', down:'<path d="M4 6l4 4 4-4"/>',
  plus:'<path d="M8 3v10M3 8h10"/>', minus:'<path d="M3 8h10"/>', x:'<path d="M4 4l8 8M12 4l-8 8"/>',
  copy:'<rect x="5" y="5" width="8" height="8"/><path d="M3 11V3h8"/>', flag:'<path d="M4 14V2M4 3h8l-2 3 2 3H4"/>',
  board:'<rect x="2" y="3" width="12" height="9"/><path d="M6 14h4"/>', play:'<path d="M5 3l8 5-8 5z"/>',
  list:'<path d="M3 4h10M3 8h10M3 12h10"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 16 16" aria-hidden="true">${ICON[n]}</svg>`;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   state
   ===================================================================== */
const defaultState = () => ({
  rev: 0, quizId: "", answerMode: "each", revealMode: "review", introRules: true, teams: [], scores: {}, shown: -1, prevShown: -1,
  live: { round: -1, step: 0, view: "play", timerEnd: null, review: null }
});
let S = defaultState();
let role = "board";       // "host" | "board" | "player"
let lastScrollK = "", PNAME = "", PAD = { strokes: [], color: "#F2EDDC", size: 8, bg: "#1F2A5A" }, padOpen = false, logoSkip = false;
let ANS = {}, MARKS = {}, me = null, MY = {}, ST = {}, playerTab = "sheet", joinError = "", joining = false, prevView = "play";
let tab = "run";
let introReturnView = null; // host-local navigation bookmark; never resets quiz progress
let scoreRound = 0;
let confirmReset = false;
let toast = "";
let ready = false;

function normalise(d) {
  const b = defaultState();
  const o = Object.assign(b, d || {});
  o.live = Object.assign(b.live, (d && d.live) || {});
  o.teams = Array.isArray(o.teams) ? o.teams : [];
  o.scores = o.scores || {};
  return o;
}

/* ---------- scoring ---------- */
function roundPts(team, ri) {
  const v = S.scores[team.id] && S.scores[team.id][ri];
  if (v === undefined || v === null || v === "") return null;
  return v * (team.joker === ri ? 2 : 1);
}
function standings(through) {
  const rows = S.teams.map(t => {
    let total = 0; const per = [];
    for (let r = 0; r <= through; r++) { const p = roundPts(t, r); per.push(p); if (p !== null) total += p; }
    return { id: t.id, name: t.name, joker: t.joker, total, per };
  });
  rows.sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  rows.forEach((r, i) => { r.rank = i > 0 && r.total === rows[i - 1].total ? rows[i - 1].rank : i + 1; });
  rows.forEach(r => { r.tie = rows.filter(x => x.rank === r.rank).length > 1; });
  return rows;
}

/* ---------- steps ---------- */
function buildSteps(ri) {
  const r = BANK.rounds[ri]; const mode = r.forceMode || S.answerMode;
  const st = [{ t: "intro" }]; const n = r.questions.length;
  const rv = S.revealMode === "review";
  if (r.type === "bonus") {
    st.push({ t: "q", qi: 0, reveal: false }, { t: "timer", secs: r.timer || 150 }, { t: "collect" }, { t: rv ? "roundend" : "marking" });
    return st;
  }
  if (r.type === "tiebreak") { st.push({ t: "q", qi: 0, reveal: false }, { t: "q", qi: 0, reveal: true }); return st; }
  if (rv) {
    for (let i = 0; i < n; i++) st.push({ t: "q", qi: i, reveal: false });
    if (r.finale) st.push({ t: "finale" });
    st.push({ t: "roundend" });
    return st;
  }
  if (mode === "each") { for (let i = 0; i < n; i++) st.push({ t: "q", qi: i, reveal: false }, { t: "q", qi: i, reveal: true }); }
  else {
    for (let i = 0; i < n; i++) st.push({ t: "q", qi: i, reveal: false });
    st.push({ t: "collect" });
    for (let i = 0; i < n; i++) st.push({ t: "q", qi: i, reveal: true, phase: "answers" });
  }
  if (r.finale) st.push({ t: "finale" });
  st.push({ t: "marking" });
  return st;
}
function stepLabel(r, s) {
  switch (s.t) {
    case "intro": return "Round title card";

  const ae = document.activeElement; const fk = ae && ae.dataset && ae.dataset.fk; const pos = ae && ae.selectionStart; const val = ae && ae.tagName.match(/INPUT|TEXTAREA/) ? ae.value : null;
  if (!setApp(playerHTML())) return padBind();
  if (fk) { const el = $(`[data-fk="${fk}"]`); if (el && !el.disabled) { if (val !== null) el.value = val; el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
  $$("[data-st]").forEach(el => { const [a, b] = el.dataset.st.split("-"); setStatus(a, b); });
  padBind();
  const nw = $(".rv .now"); if (nw && nw.dataset.k !== lastScrollK) { lastScrollK = nw.dataset.k; nw.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" }); }
}
function sendAnswerNow(ri, qi, text) {
  MY[ri] = MY[ri] || {}; MY[ri][qi] = text; ST[ri + "-" + qi] = "sending";
  if (!Net.send({ t: "ans", round: ri, qi, text })) ST[ri + "-" + qi] = "offline";
  try { localStorage.setItem("pq:my:" + code, JSON.stringify(MY)); } catch (e) {}
}
let sendTimers = {};
function sendAnswer(ri, qi, text) {
  MY[ri] = MY[ri] || {}; MY[ri][qi] = text; ST[ri + "-" + qi] = "sending"; setStatus(ri, qi);
  const k = ri + "-" + qi; clearTimeout(sendTimers[k]);
  sendTimers[k] = setTimeout(() => { if (!Net.send({ t: "ans", round: ri, qi, text })) { ST[k] = ""; const el = document.querySelector(`[data-st="${k}"]`); if (el) el.textContent = "Offline. Will retry when reconnected."; } }, 450);
  try { localStorage.setItem("pq:my:" + code, JSON.stringify(MY)); } catch (e) {}
}
document.addEventListener("keydown", e => { if (role === "player" && e.key === "Enter" && e.target.id === "pname") { const b = $("[data-pjn]"); if (b) b.click(); } });
document.addEventListener("input", e => { if (role !== "player") return; const el = e.target; if (el.id === "pname") { PNAME = el.value; return; } if (el.dataset.pa) { const [ri, qi] = el.dataset.pa.split("|"); sendAnswer(+ri, +qi, el.value); } });
document.addEventListener("click", e => {
  if (role !== "player") return; const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
  if (d.ptab) { playerTab = d.ptab; return render(); }
  if (d.pick) { const [ri, qi, L] = d.pick.split("|"); if (t.disabled) return; sendAnswerNow(+ri, +qi, L); return render(); }
  if (d.jokerOn !== undefined) { if (!Net.send({ t: "joker", round: +d.jokerOn, on: true })) { joinError = "Not connected. Try again."; } return render(); }
  if (d.jokerOff !== undefined) { Net.send({ t: "joker", round: +d.jokerOff, on: false }); return render(); }
  if (d.pc) { PAD.color = d.pc; return render(); }
  if (d.pb) { PAD.bg = d.pb; return render(); }
  if (d.ps) { PAD.size = +d.ps; return render(); }
  if (d.pundo !== undefined) { PAD.strokes.pop(); return render(); }
  if (d.pclear !== undefined) { PAD.strokes = []; return render(); }
  if (d.psug !== undefined) { let n; do { n = FUN_NAMES[Math.floor(Math.random() * FUN_NAMES.length)]; } while (n === PNAME && FUN_NAMES.length > 1); PNAME = n; const el = $("#pname"); if (el) el.value = n; return render(); }
  if (d.plogo !== undefined) { padOpen = true; PAD.strokes = []; joinError = ""; return render(); }
  if (d.pskip !== undefined) { padOpen = false; logoSkip = true; return render(); }
  if (d.psave !== undefined) { const logo = padExport(); if (!logo) { joinError = "Draw something first."; return render(); } if (!Net.send({ t: "logo", logo })) { joinError = "Not connected. Try again in a moment."; return render(); } padOpen = false; logoSkip = true; joinError = ""; PAD.strokes = []; return render(); }
  if (d.pj) { const tm = S.teams.find(x => x.id === d.pj); joining = true; joinError = ""; Net.send({ t: "hello", teamId: d.pj, name: tm && tm.name }); return render(); }
  if (d.pjn !== undefined) { const v = PNAME || ($("#pname") || {}).value || ""; if (!v.trim()) { joinError = "Give your team a name, or tap Suggest one."; return render(); } joining = true; joinError = ""; if (!Net.send({ t: "hello", name: v, logo: padExport() })) { joining = false; joinError = "Not connected yet. Try again in a moment."; } else { logoSkip = true; } return render(); }
  if (d.pleave !== undefined) { me = null; MY = {}; try { localStorage.removeItem("pq:me:" + code); localStorage.removeItem("pq:my:" + code); } catch (e) {} return render(); }
});

/* =====================================================================
   boot
   ===================================================================== */
let lastHTML = "";
function setApp(html) { if (html === lastHTML) return false; lastHTML = html; $("#app").innerHTML = html; return true; }
function message(title, body, action) {
  setApp(`<div class="center"><div class="panel"><h3>${esc(title)}</h3><p class="note">${esc(body)}</p>${action || ""}</div></div>`);
}
function render() {
  if ((role === "board" || role === "player") && !BANK) {
    const waiting = { waiting: "No reply from the host yet. Check the room code, and that the host's quiz tab is open and says Online. Still trying.", reconnecting: "Lost the host. Reconnecting." }[Net.status] || "Connecting to the room.";
    return message(`Room ${code}`, waiting, `<div class="skeleton" style="width:70%;margin-top:14px"></div><p class="note" style="margin-top:12px;font-size:13px">Connection: ${esc(Net.paths())}</p><button class="btn" style="margin-top:12px" onclick="location.reload()">Reload</button>`);
  }
  document.body.classList.toggle("theme-deco", deco());
  if (role === "host") renderHost(); else if (role === "player") renderPlayer(); else renderBoard();
}
(async function boot() {
  const q = new URLSearchParams(location.search);
  const room = (q.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const qz = q.get("quiz");
  if (room) {
    code = room; role = q.get("play") ? "player" : "board";
    if (role === "player") { try { me = JSON.parse(localStorage.getItem("pq:me:" + room)); MY = JSON.parse(localStorage.getItem("pq:my:" + room)) || {}; } catch (e) { me = null; MY = {}; } }
    render(); Net.board(room); return;
  }
  if (qz) {
    try { await ensureQuiz(qz); } catch (e) { return message("Quiz not found", "Check the link, or pick a quiz from the list.", '<a class="btn" href="index.html" style="margin-top:12px">All quizzes</a>'); }
    role = "host"; quizId = qz; ready = true;
    let saved = null; try { saved = JSON.parse(localStorage.getItem("pq:" + qz)); } catch (e) {}
    if (saved && saved.code && saved.state) { code = saved.code; S = normalise(saved.state); ANS = saved.ans || {}; MARKS = saved.marks || {}; } else { code = newCode(); S = defaultState(); }
    S.quizId = qz; tab = S.live.round < 0 ? "teams" : "run";
    saveHost(); Net.host(code); render(); return;
  }
  location.replace("index.html");
})();
</script>
